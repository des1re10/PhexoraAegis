name: temporary-aegis-rebrand-validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-aegis-rebrand-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aegis research repository
        uses: actions/checkout@v4
        with:
          path: PhexoraAegis

      - name: Checkout shared registry owner
        uses: actions/checkout@v4
        with:
          repository: des1re10/Libraries
          ref: main
          path: Libraries
          token: ${{ secrets.LIBRARIES_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Aegis operational identity
        working-directory: PhexoraAegis
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '# Phexora Aegis' README.md
          grep -Fq 'aegis.phexora.ai' README.md
          grep -Fq 'Phexora Aegis' index.html
          grep -Fq 'aegis.phexora.ai' index.html
          test -f tools/Scripts/Startup/run_phexora_aegis.sh
          test -f tools/Scripts/Startup/phexora_aegis_deploy_script.sh
          test ! -e tools/Scripts/Startup/run_quantum.sh
          test ! -e tools/Scripts/Startup/quantum_deploy_script.sh
          test ! -e Documentation/Quantum_Market_Thesis.html
          test -f Documentation/Phexora_Aegis_Market_Thesis.html
          if git grep -In 'quantum\.phexora\.ai\|run_quantum\.sh\|quantum_deploy_script\.sh' -- .; then
            echo 'Stale operational Quantum identity remains'
            exit 1
          fi

      - name: Validate shell and site syntax
        working-directory: PhexoraAegis
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/Scripts/Startup/run_phexora_aegis.sh
          bash -n tools/Scripts/Startup/phexora_aegis_deploy_script.sh
          bash -n build-pdfs.sh
          bash -n start-local.sh
          node --check assets/js/site-i18n.js

      - name: Validate registry identity
        env:
          PYTHONPATH: ${{ github.workspace }}/Libraries/Python
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Libraries/Python/ApplicationRegistry.py
          python - <<'PY'
          from ApplicationRegistry import APPLICATION_REGISTRY

          assert "aegis" in APPLICATION_REGISTRY
          assert "quantum" not in APPLICATION_REGISTRY
          app = APPLICATION_REGISTRY["aegis"]
          assert app.display_name == "Phexora Aegis"
          assert app.get_public_base_url() == "https://aegis.phexora.ai"
          assert app.project_path_windows.endswith(r"\PhexoraAegis")
          assert app.project_path_linux == "/home/des1re10/PhexoraAegis/PhexoraAegis"
          assert app.main_script_linux == "tools/Scripts/Startup/run_phexora_aegis.sh"
          assert app.deploy_script == "phexora_aegis_deploy_script.sh"
          PY

      - name: Preserve released 0.5.4 publication artifacts
        working-directory: PhexoraAegis
        shell: bash
        run: |
          set -euo pipefail
          test -f papers/zkprivacy/zkprivacy-quantum-spec-v1.md
          test -f papers/zkprivacy/zkprivacy-quantum-spec-v1.pdf
          test -f papers/zkprivacy/quantum-private-transaction-feasibility.md
          test -f papers/zkprivacy/quantum-private-transaction-feasibility.pdf
          grep -Fq 'historical project codename' README.md
